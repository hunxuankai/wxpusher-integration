name: Check skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install maintenance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skill
        run: python tools/check_skill.py
      - name: Check bundled license
        run: python -c "from pathlib import Path; assert Path('LICENSE').read_text(encoding='utf-8') == Path('skills/wxpusher-integration/LICENSE.md').read_text(encoding='utf-8'), 'License copies differ'"
      - name: Check whitespace
        run: git diff-tree --check --root -r HEAD
      - name: Verify isolated installation
        shell: pwsh
        run: |
          $testSkillsRoot = Join-Path $env:RUNNER_TEMP ('wxpusher-check-' + [guid]::NewGuid().ToString('N'))
          ./tools/install-local.ps1 -SkillsRoot $testSkillsRoot -DryRun
          if (Test-Path -LiteralPath $testSkillsRoot) { throw 'DryRun unexpectedly wrote files.' }
          ./tools/install-local.ps1 -SkillsRoot $testSkillsRoot
          python tools/check_skill.py (Join-Path $testSkillsRoot 'wxpusher-integration')
          if ($LASTEXITCODE -ne 0) { throw 'Installed skill failed validation.' }
